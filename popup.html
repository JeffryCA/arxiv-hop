<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>arXiv Hop</title>
    <link rel="stylesheet" href="popup.css">
    <script src="downloads.js" defer></script>
    <script src="popup.js" defer></script>
  </head>
  <body>
    <header>
      <img src="icons/icon48.png" alt="" width="32" height="32">
      <div><h1>arXiv Hop</h1><p>Follow your curiosity.</p></div>
    </header>
    <label class="setting" for="enabled">
      <span>Citation links</span>
      <input id="enabled" type="checkbox" role="switch" disabled>
    </label>
    <p id="status" role="status" aria-live="polite">Loading…</p>
    <label class="destination-label" for="destination">Open citations in</label>
    <select id="destination" disabled>
      <option value="html">arXiv HTML</option>
      <option value="pdf">arXiv PDF</option>
      <option value="abstract">Abstract</option>
    </select>
    <details class="downloads">
      <summary>PDF downloads</summary>
      <fieldset id="download-settings" disabled>
        <span class="destination-label">Download folder</span>
        <p id="download-folder">Downloads (default)</p>
        <button type="button" id="choose-folder">Choose folder…</button>
        <button type="button" id="reconnect-folder" hidden>Reconnect folder</button>
        <button type="button" id="reset-folder" hidden>Use Downloads</button>
        <p id="folder-access-help" hidden>Choose “Allow on every visit” when the browser asks.</p>
        <label class="destination-label" for="download-naming">File name</label>
        <select id="download-naming">
          <option value="title">Paper title, when available</option>
          <option value="id">arXiv ID</option>
        </select>
      </fieldset>
      <p id="download-status" role="status" aria-live="polite"></p>
    </details>
  </body>
</html>
