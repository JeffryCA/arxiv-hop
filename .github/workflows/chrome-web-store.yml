name: Chrome Web Store release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chrome-web-store
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag is on main
        if: github.ref_type == 'tag'
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Test
        run: node --test tests/*.test.cjs
      - name: Package extension
        run: bash scripts/package-chrome.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: arxiv-hop-chrome
          path: dist/arxiv-hop-chrome.zip
          if-no-files-found: error
      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' && vars.CWS_PUBLISHER_ID != ''
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          access_token_lifetime: 300s
          create_credentials_file: false
          export_environment_variables: false
      - name: Submit update for review
        if: github.event_name == 'push' && vars.CWS_PUBLISHER_ID != ''
        env:
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ vars.CWS_ITEM_ID }}
        run: node scripts/publish-chrome.mjs
